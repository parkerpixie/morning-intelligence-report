name: Update Morning Intelligence Report

on:
  schedule:
    # GitHub scheduled workflows can start substantially late. Stagger several
    # overnight attempts so at least one lands before the morning report is used.
    # These UTC windows are all after midnight in America/Chicago year-round:
    # 1:20/12:20, 2:50/1:50, 4:20/3:20, and 6:20/5:20 in CDT/CST.
    # Earlier attempts also provide cover when GitHub delays scheduled jobs.
    - cron: "20 6 * * *"
    - cron: "50 7 * * *"
    - cron: "20 9 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_report.py"
      - "scripts/generate_report_v2.py"
      - "scripts/generate_report_v3.py"
      - "scripts/normalize_report.py"
      - "scripts/validate_and_archive.py"
      - ".github/workflows/update-report.yml"

permissions:
  contents: write

concurrency:
  group: morning-intelligence-report
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate personalized report from expanded RSS feeds
        shell: bash
        run: |
          set -o pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Report generation attempt ${attempt}/${max_attempts}"
            if python scripts/generate_report_v3.py; then
              echo "Report generation succeeded."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$((attempt * 10))
              echo "Generation failed, likely because a remote feed/API disconnected. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
          done

          echo "::error::Report generation failed after ${max_attempts} attempts."
          exit 1

      - name: Normalize report for the website
        run: python scripts/normalize_report.py

      - name: Validate and archive completed report
        run: python scripts/validate_and_archive.py

      - name: Commit refreshed report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/report.json data/report-index.json data/archive-search.json data/story-history.json data/archive
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Refresh morning report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
